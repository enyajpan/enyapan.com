      <!-- Figma frame "Messages" -->
      <main id="messages" class="messages">
        <form class="note-form" novalidate>
          <label class="note-form__field">
            <span class="note-form__label">Name (optional)</span>
            <input name="name" type="text" maxlength="40" autocomplete="name">
          </label>
          <label class="note-form__field">
            <span class="note-form__label">Message</span>
            <textarea name="body" maxlength="280" required></textarea>
            <span class="note-form__count" aria-live="polite">0 / 280</span>
          </label>
          <fieldset class="note-form__colors">
            <legend class="note-form__label">Color</legend>
            <label class="swatch swatch--lime"><input type="radio" name="color" value="lime" checked aria-label="Dark green"><span></span></label>
            <label class="swatch swatch--green"><input type="radio" name="color" value="green" aria-label="Light green"><span></span></label>
            <label class="swatch swatch--purple"><input type="radio" name="color" value="purple" aria-label="Pink"><span></span></label>
            <label class="swatch swatch--violet"><input type="radio" name="color" value="violet" aria-label="Purple"><span></span></label>
            <label class="swatch swatch--cobalt"><input type="radio" name="color" value="cobalt" aria-label="Blue"><span></span></label>
            <label class="swatch swatch--gray"><input type="radio" name="color" value="gray" aria-label="Gray"><span></span></label>
          </fieldset>
          <input class="note-form__trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="note-form__actions">
            <button class="case__cue note-form__submit" type="submit">Submit</button>
            <p class="note-form__status" role="status"></p>
          </div>
        </form>

        <section class="wall" aria-label="Messages">
          <ol class="wall__list"></ol>
          <div class="wall__bar">
            <button class="case__cue wall__view" type="button" aria-pressed="false">View as grid</button>
          </div>
        </section>

        <p class="messages__contact">For work / professional inquiries, please contact <a href="mailto:enyajpan@gmail.com">enyajpan@gmail.com</a>.</p>
